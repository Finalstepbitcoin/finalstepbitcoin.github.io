# Aggiorna da solo l'elenco dei video sul sito.
#
# Gira una volta al giorno: legge il feed del canale YouTube, riscrive le
# tre schede dentro index.html e pubblica solo se e' cambiato qualcosa.
# Se pubblichi un video e lo vuoi subito online senza aspettare il giro
# notturno: scheda "Actions" del repository -> questo compito -> "Run workflow".

name: Aggiorna i video dal canale

on:
  schedule:
    # PLAK pubblica i video verso le 11:15 italiane, quindi si controlla
    # subito dopo. GitHub pero' ragiona sempre in UTC e non sa niente
    # dell'ora legale, percio' servono due righe:
    #   09:20 UTC = 11:20 in Italia d'estate
    #   10:20 UTC = 11:20 in Italia d'inverno
    # Quella fuori stagione trova che non c'e' niente di nuovo e non
    # pubblica: costa nulla e cosi' l'orario e' giusto tutto l'anno.
    - cron: '20 9 * * *'
    - cron: '20 10 * * *'
    # Secondo giro un'ora dopo, come rete di sicurezza: i compiti a
    # orario di GitHub partono spesso in ritardo, e a volte il feed di
    # YouTube ci mette qualche minuto ad accorgersi del video nuovo.
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4

      - name: Rileggi il feed e riscrivi le schede
        run: python3 .github/scripts/aggiorna-video.py

      - name: Pubblica, ma solo se e' cambiato qualcosa
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "Nessun video nuovo: non pubblico niente."
            exit 0
          fi
          git config user.name  "Aggiornamento automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Video: aggiornato l'elenco dal canale YouTube"
          git push
