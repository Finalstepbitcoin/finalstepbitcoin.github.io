# Pubblica la copia del sito su Nostr (nsite), firmata con la chiave
# dedicata al sito ("Sito Internet", npub1xrjmk08h...), mai con quella
# personale di PLAK.
#
# Parte da solo:
#   - a ogni modifica pubblicata su main;
#   - quando il compito dei video (video.yml) ha pubblicato qualcosa: e' lui
#     a chiamarlo, perche' per regola di GitHub le modifiche fatte da un
#     compito non ne fanno partire altri da sole.
# Si puo' lanciare anche a mano: scheda "Actions" del repository -> questo
# compito -> "Run workflow". Con la casella "prova" spuntata fa solo la prova
# generale: mostra cosa pubblicherebbe, senza caricare ne' pubblicare niente.
#
# La chiave segreta sta nel segreto NSITE_NSEC del repository (Settings ->
# Secrets and variables -> Actions) e non va scritta in nessun file.
#
# nsyte, il programma che pubblica, NON si scarica gia' pronto: si prende il
# suo codice sorgente a un punto preciso (versione 0.28.1, controllata il
# 21/10/2026) e lo si avvia con l'elenco delle sue dipendenze bloccate dalle
# impronte (deno.lock). Se anche un solo pezzo fosse diverso, il compito si
# fermerebbe invece di pubblicare. Per passare a una versione nuova di nsyte:
# prima rifare il controllo, poi cambiare NSYTE_COMMIT qui sotto.

name: Copia del sito su Nostr

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova generale (non pubblica niente)"
        type: boolean
        default: false

# Mai due pubblicazioni insieme: la seconda aspetta che finisca la prima.
concurrency:
  group: nsite
  cancel-in-progress: false

permissions:
  contents: read

env:
  NSYTE_COMMIT: bf0f99d058b89720aaa50b22226ccd481b5ee4ef # nsyte v0.28.1
  # Relay e server dei file: sono quelli che avevano accettato il sito
  # pubblicato a mano il 26/08/2026 (relay.nostr.band e il relay della
  # community allora l'avevano rifiutato).
  RELAY: wss://nsite.run,wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net,wss://relay.nsite.lol
  SERVER: https://nsite.run,https://blssm.us,https://nostr.download

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara la cartella da pubblicare
        # Gli stessi file del sito, tranne quelli che servono solo a GitHub
        # (CNAME, .gitignore, .github/), le note LEGGIMI e il file con cui
        # TikTok verifica il dominio.
        # La cartella deve stare QUI e con un nome relativo: nsyte attacca
        # sempre il percorso alla cartella corrente, e con un percorso assoluto
        # (prova del 21/10/2026) cercava altrove e trovava 0 file.
        run: |
          mkdir -p sito-nostr
          git ls-files -z \
            | grep -zvE '^(\.gitignore|CNAME|\.github/.*|tiktok[^/]*\.txt)$|(^|/)LEGGIMI[^/]*$' \
            | xargs -0 cp --parents -t sito-nostr
          echo "File da pubblicare: $(find sito-nostr -type f | wc -l)"

      - name: Scarica nsyte alla versione controllata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sandwichfarm/nsyte
          ref: ${{ env.NSYTE_COMMIT }}
          path: .nsyte
          persist-credentials: false

      - name: Installa Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Controlla che la chiave sia quella del sito
        # Se nel segreto finisse un'altra chiave (per esempio quella personale
        # di PLAK), il compito si ferma qui, prima di pubblicare qualsiasi cosa.
        # Gira anche nella prova generale, che altrimenti la chiave non la usa.
        env:
          NSITE_NSEC: ${{ secrets.NSITE_NSEC }}
          ATTESA: 30e5bb3cf754ed49dd3422abfed87f030b08eed545e307580da90638e291ef92
        run: |
          cat > "$RUNNER_TEMP/verifica.ts" <<'FINE'
          import { bech32 } from "@scure/base";
          import { schnorr } from "@noble/curves/secp256k1";
          let pub = "";
          try {
            const s = (Deno.env.get("NSITE_NSEC") ?? "").trim();
            let chiave: Uint8Array;
            if (/^[0-9a-f]{64}$/i.test(s)) {
              chiave = Uint8Array.from(s.match(/../g)!.map((h) => parseInt(h, 16)));
            } else {
              const { prefix, words } = bech32.decode(s as `${string}1${string}`);
              if (prefix !== "nsec") throw new Error();
              chiave = Uint8Array.from(bech32.fromWords(words));
            }
            pub = Array.from(schnorr.getPublicKey(chiave), (b) => b.toString(16).padStart(2, "0")).join("");
          } catch {
            // Messaggio generico apposta: l'errore originale potrebbe citare il segreto.
            console.error("FERMO: il segreto NSITE_NSEC non contiene una nsec valida.");
            Deno.exit(1);
          }
          if (pub !== Deno.env.get("ATTESA")) {
            console.error("FERMO: la chiave nel segreto NSITE_NSEC non e' quella del sito.");
            Deno.exit(1);
          }
          console.log("Chiave giusta: firmera' come " + pub.slice(0, 8) + "...");
          FINE
          deno run --frozen --no-prompt \
            --config=.nsyte/deno.json --lock=.nsyte/deno.lock \
            --allow-env=NSITE_NSEC,ATTESA \
            "$RUNNER_TEMP/verifica.ts"

      - name: Pubblica su Nostr
        # --frozen: se le dipendenze non combaciano con le impronte, si ferma.
        # Niente permesso di lanciare altri programmi (--allow-run): non serve.
        # --sync: ricontrolla che ogni file stia su tutti i server.
        # --scan-level low: il controllo anti-segreti cerca solo nsec e codici
        # bunker. Al livello normale (21/10/2026) si fermava per due falsi
        # allarmi: la chiave PUBBLICA di PLAK in index.html (serve a leggere gli
        # articoli) e la frase "passphrase: cinque dadi" in risorse.html.
        # ATTENZIONE: in nsyte 0.28.1 --publish-relay-list e
        # --publish-server-list vengono ignorati in silenzio (difetto: quella
        # parte gira solo con --publish-app-handler, che non vogliamo). Il sito
        # funziona lo stesso: verificato il 21/10/2026 su nsite.lol, nsite.run e
        # nsite.cloud. Restano qui per quando una versione nuova li sistemera'.
        env:
          NSITE_NSEC: ${{ secrets.NSITE_NSEC }}
          PROVA: ${{ inputs.prova && '--dry-run' || '' }}
        run: |
          deno run --frozen --no-prompt \
            --config=.nsyte/deno.json --lock=.nsyte/deno.lock \
            --allow-read --allow-write --allow-net --allow-env --allow-sys \
            .nsyte/src/cli.ts deploy sito-nostr \
            --non-interactive --no-config --sync --scan-level low \
            --sec "$NSITE_NSEC" \
            --relays "$RELAY" --servers "$SERVER" \
            --publish-relay-list --publish-server-list \
            $PROVA
